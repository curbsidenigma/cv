name: Build CV

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege by default; the deploy job widens this for itself only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: cv.pdf

      - name: Assemble Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp cv.pdf _site/cv.pdf
          # Root URL redirects to the PDF.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=cv.pdf">' > _site/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
